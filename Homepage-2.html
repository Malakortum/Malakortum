<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ข่าวทั้งหมด | แจ้งภัยพิบัติ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Prompt', sans-serif;
    }

    .thumbnail-custom {
      width: 120px;
      height: 120px;
      font-size: 14px;
      border-radius: 50%; /* เปลี่ยนจาก 0 เป็น 50% เพื่อให้เป็นทรงกลม */
    }
  </style>
</head>
<body class="bg-white text-gray-900 flex flex-col min-h-screen pb-20 mb-24">

  <!-- แถบค้นหา -->
  <div class="bg-black p-4 flex items-center">
    <form action="search.html" method="GET" class="flex items-center w-full">
      <input 
        type="text" 
        name="query"
        placeholder="ค้นหาข่าว..." 
        class="flex-1 px-4 py-2 rounded-md text-black"
      />
      <button type="submit" class="ml-2 text-white text-xl">🔍</button>
    </form>
  </div>

  <!-- ข่าวด่วน -->
  <div class="p-4 flex items-center space-x-4">
    <img src="https://us-fbcloud.net/wb/data/1516/1516834-img.wdbnxk.w9hf.opsb1k4i.webp" alt="ด่วน" class="rounded-lg w-24 h-24 object-cover" loading="lazy">
    <div>
      <h2 class="text-red-600 text-xl font-bold mb-1">ด่วน</h2>
      <p class="text-sm">ง่วง<br>นอนไหม ไม่นอน อนน</p>
      <a href="#" class="inline-block mt-2 bg-red-500 text-white px-3 py-1 rounded-full text-sm hover:bg-red-600 transition-colors">แนวทางปฏิบัติ</a>
    </div>
  </div>

  <!-- หมวดหมู่ข่าว -->
  <div class="grid grid-cols-3 gap-4 px-4 mb-10">
    <!-- ใช้ hover effect และ lazy loading -->
    <a href="category-politics.html" class="flex flex-col items-center text-center hover:scale-105 transition-transform duration-200">
      <img src="https://s.isanook.com/ns/0/ud/1953/9769358/new-thumbnail1200x720(5)(4).jpg" class="thumbnail-custom object-cover" loading="lazy">
      <span class="mt-1 text-sm">การเมือง</span>
      </a>
    <a href="category-economy.html" class="flex flex-col items-center text-center hover:scale-105 transition-transform duration-200">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWbeTIuINwwhZGaobit6Ygnb8Wz6S0CTRCqg&s" class="thumbnail-custom object-cover" loading="lazy">
      <span class="mt-1 text-sm">เศรษฐกิจ</span>
    </a>
    <a href="category-society.html" class="flex flex-col items-center text-center hover:scale-105 transition-transform duration-200">
      <img src="https://cdni-hw.ch7.com/dm/sz-md/i/images/2024/12/09/67564b66a6b291.76457958.jpg" class="thumbnail-custom object-cover" loading="lazy">
      <span class="mt-1 text-sm">สังคม</span>
    </a>
    <a href="category-sport.html" class="flex flex-col items-center text-center hover:scale-105 transition-transform duration-200">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWqI0OYqDfMJtY7_OQjD8cqZpw07-Ra7x_yg&s" class="thumbnail-custom object-cover" loading="lazy">
      <span class="mt-1 text-sm">กีฬา</span>
    </a>
    <a href="category-entertainment.html" class="flex flex-col items-center text-center hover:scale-105 transition-transform duration-200">
      <img src="https://static.kpopping.com/33/1/240505-RIIZE-FAN-CON-RIIZING-DAY-in-SEOUL-Day-2-WONBIN-documents-4.jpeg" class="thumbnail-custom object-cover" loading="lazy">
      <span class="mt-1 text-sm">บันเทิง</span>
    </a>
    <a href="category-environment.html" class="flex flex-col items-center text-center hover:scale-105 transition-transform duration-200">

      <span class="mt-1 text-sm">สิ่งแวดล้อม</span>
    </a>
    <a href="category-world.html" class="flex flex-col items-center text-center hover:scale-105 transition-transform duration-200">
      <img src="https://img.pptvhd36.com/thumbor/2025/03/31/news-762d7dc.jpg" class="thumbnail-custom object-cover" loading="lazy">
      <span class="mt-1 text-sm">ต่างประเทศ</span>
    </a>
    <a href="category-science.html" class="flex flex-col items-center text-center hover:scale-105 transition-transform duration-200">

    </a>

      <span class="mt-1 text-sm">ทั่วไทย</span>
    </a>
  </div>

  <div class="fixed bottom-0 left-0 right-0 bg-yellow-300 flex justify-around items-center p-2 border-t z-10">
    <a href="login.html" class="flex flex-col items-center text-xs hover:text-gray-800">
      <img src="https://icons.veryicon.com/png/o/miscellaneous/test-5/icon-my-page.png" class="w-8 h-8 mb-1" alt="บัญชี" loading="lazy"/>
      <span>บัญชี</span>
    </a>
    <a href="index.html" class="flex flex-col items-center text-xs hover:text-gray-800">
      <img src="https://cdn-icons-png.flaticon.com/512/44/44907.png" class="w-8 h-8 mb-1" alt="โฮม" loading="lazy"/>
      <span>โฮม</span>
    </a>
    <a href="notifications.html" class="flex flex-col items-center text-xs hover:text-gray-800">
      <img src="https://icon-library.com/images/notification-icon/notification-icon-3.jpg" class="w-8 h-8 mb-1" alt="การแจ้งเตือน" loading="lazy"/>
      <span>แจ้งเตือน</span>

</html>
